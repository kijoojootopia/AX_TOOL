name: Update USD/KRW rate

on:
  schedule:
    - cron: '10 0 * * 1-5'   # 평일 09:10 KST
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rate from ExchangeRate-API
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: |
          test -n "$EXCHANGE_RATE_API_KEY" || { echo "Secret EXCHANGE_RATE_API_KEY is not set"; exit 1; }
          curl -fsS "https://v6.exchangerate-api.com/v6/${EXCHANGE_RATE_API_KEY}/pair/USD/KRW" -o /tmp/r.json
          mkdir -p data
          node -e '
            const j = require("/tmp/r.json");
            if (j.result !== "success") { console.error(j); process.exit(1); }
            const out = {
              base: "USD", quote: "KRW",
              rate: j.conversion_rate,
              date: new Date(j.time_last_update_unix * 1000).toISOString().slice(0, 10),
              source: "ExchangeRate-API",
              fetched_at: new Date().toISOString()
            };
            require("fs").writeFileSync("data/usd-krw.json", JSON.stringify(out, null, 2) + "\n");
            console.log(out);
          '

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usd-krw.json
          git diff --cached --quiet || { git commit -m "chore: update USD/KRW rate"; git push; }
