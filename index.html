<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX Tools</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b1f24;--muted:#5f6b7a;--line:#dde2e8;--brand:#1f4e79}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:40px 16px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 28px}
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
a.tool{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;color:inherit;text-decoration:none}
a.tool:hover{border-color:var(--brand)}
a.tool b{display:block;font-size:16px;color:var(--brand);margin-bottom:4px}
a.tool span{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>AX Tools</h1>
  <p class="sub">해외영업 반복 업무를 줄이는 웹 도구 모음</p>
  <div class="list">
    <a class="tool" href="quotation-builder/">
      <b>수출 견적서 계산기</b>
      <span>원가·환율·물류비로 EXW/FOB/CFR/CIF 단가 비교, 협상가 마진 확인, 영문 견적서 출력</span>
    </a>
    <!-- 새 도구는 여기에 a.tool 하나씩 추가 -->
  </div>
</div>
</body>
</html>
